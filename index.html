<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Comfy HVAC - Job Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0C447C 0%, #185FA5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .login-container h1 {
            color: #0C447C;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            outline: none;
            border-color: #0C447C;
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }

        .role-btn.active {
            background: #0C447C;
            color: white;
            border-color: #0C447C;
        }

        .login-btn {
            padding: 14px;
            background: #D9534F;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }

        .login-btn:active {
            background: #c9423f;
        }

        .error-message {
            color: #D9534F;
            font-size: 14px;
            margin-top: 10px;
        }

        .modal {
            display: none !important;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            pointer-events: none !important;
            -webkit-user-select: none;
            user-select: none;
        }

        .modal.show {
            display: flex !important;
            pointer-events: auto !important;
        }

        .modal.show .modal-content {
            pointer-events: auto !important;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            pointer-events: auto !important;
            -webkit-user-select: text;
            user-select: text;
        }

        .modal-header {
            background: #0C447C;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            padding: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
            -webkit-user-select: text;
            user-select: text;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #0C447C;
            font-size: 14px;
            -webkit-user-select: none;
            user-select: none;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            -webkit-user-select: text;
            user-select: text;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #378ADD;
            box-shadow: 0 0 0 2px rgba(55, 138, 221, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save, .btn-cancel, .btn-delete {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            -webkit-user-select: none;
            user-select: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-save {
            background: #185FA5;
            color: white;
        }

        .btn-save:active {
            background: #0C447C;
        }

        .btn-cancel {
            background: #ddd;
            color: #333;
        }

        .btn-cancel:active {
            background: #ccc;
        }

        .btn-delete {
            background: #D9534F;
            color: white;
        }

        .btn-delete:active {
            background: #c9423f;
        }

        .readonly-notice {
            background: #fffbea;
            border-left: 4px solid #D9534F;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            color: #333;
            font-size: 13px;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            display: none;
        }

        .app-container.show {
            display: block;
        }

        .header {
            background: linear-gradient(135deg, #0C447C 0%, #185FA5 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        .logout-btn {
            background: #D9534F;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            -webkit-appearance: none;
            appearance: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .logout-btn:active {
            background: #c9423f;
        }

        .main-content {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .month-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: #378ADD;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            -webkit-appearance: none;
            appearance: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .nav-btn:active {
            background: #185FA5;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .calendar-grid {
                grid-template-columns: 1fr;
            }
        }

        .month-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .month-title {
            background: #185FA5;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-header {
            background: #378ADD;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            -webkit-user-select: none;
            user-select: none;
        }

        .day-cell {
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            min-height: 120px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-number {
            font-weight: 600;
            font-size: 12px;
            color: #0C447C;
            margin-bottom: 4px;
            -webkit-user-select: none;
            user-select: none;
        }

        .job-count-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #D9534F;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .slots-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .job-slot {
            flex: 1;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .job-slot:active {
            background: #e8f4f8;
            border-color: #378ADD;
        }

        .job-slot.filled {
            background: #e8f4f8;
            border-color: #185FA5;
        }

        .slot-content {
            line-height: 1.3;
            -webkit-user-select: none;
            user-select: none;
        }

        .slot-label {
            color: #999;
            font-style: italic;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .job-customer {
            font-weight: 600;
            color: #0C447C;
            -webkit-user-select: none;
            user-select: none;
        }

        .job-city {
            color: #666;
            font-size: 10px;
            -webkit-user-select: none;
            user-select: none;
        }

        .job-details {
            color: #333;
            font-size: 10px;
            margin-top: 2px;
            -webkit-user-select: none;
            user-select: none;
        }

        @media (max-width: 768px) {
            .day-cell {
                min-height: 50px;
                padding: 8px 4px;
            }

            .day-cell .slots-container {
                display: none;
            }

            .day-number {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .day-cell.has-jobs .day-number {
                color: #D9534F;
                font-weight: bold;
            }

            .job-count-badge {
                top: 2px;
                right: 2px;
                width: 18px;
                height: 18px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>Comfy HVAC</h1>
            <p>Job Board Access</p>
            <div class="login-form">
                <input type="password" id="passwordInput" placeholder="Enter password" />
                
                <div class="role-selector">
                    <button class="role-btn active" data-role="advisor">Comfort Advisor</button>
                    <button class="role-btn" data-role="admin">Admin</button>
                </div>

                <button class="login-btn" onclick="handleLogin()">Login</button>
                <div id="loginError" class="error-message"></div>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="header-content">
                <h1>Comfy HVAC - Job Board</h1>
                <div>
                    <span id="roleDisplay" style="margin-right: 20px; font-weight: 600;"></span>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="controls">
                <div class="month-nav">
                    <button class="nav-btn" onclick="previousMonth()">← Previous</button>
                    <div style="font-weight: 600; color: #0C447C; min-width: 200px;" id="monthDisplay"></div>
                    <button class="nav-btn" onclick="nextMonth()">Next →</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <div class="modal" id="jobModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" style="flex: 1; margin: 0;"></h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div id="readonlyNotice"></div>
                <div class="form-group">
                    <label>Customer Name <span style="color: #D9534F;">*</span></label>
                    <input type="text" id="customerName" placeholder="Customer name">
                </div>
                <div class="form-group">
                    <label>City <span style="color: #D9534F;">*</span></label>
                    <input type="text" id="city" placeholder="City">
                </div>
                <div class="form-group">
                    <label>Job Details <span style="color: #D9534F;">*</span></label>
                    <textarea id="jobDetails" placeholder="Describe the work to be done..."></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn-save" onclick="saveJob()" id="saveBtn">Save</button>
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-delete" onclick="deleteJob()" id="deleteBtn" style="display: none;">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'advisor';
        let currentDate = new Date();
        let selectedSlot = null;
        let jobs = {};
        let isModalOpen = false;

        const ADVISOR_PASSWORD = 'comfy2024';
        const ADMIN_PASSWORD = 'admin2024#';
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        // ==================== AUTHENTICATION ====================
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentRole = this.dataset.role;
            });
        });

        function handleLogin() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');

            if (!password) {
                errorDiv.textContent = 'Please enter a password';
                return;
            }

            const correctPassword = currentRole === 'advisor' ? ADVISOR_PASSWORD : ADMIN_PASSWORD;
            
            if (password !== correctPassword) {
                errorDiv.textContent = 'Incorrect password';
                return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('show');
            document.getElementById('roleDisplay').textContent = currentRole === 'advisor' ? 'Comfort Advisor' : 'Admin';
            document.getElementById('passwordInput').value = '';
            
            loadData();
            render();
        }

        function handleLogout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('show');
            currentDate = new Date();
            jobs = {};
            selectedSlot = null;
            isModalOpen = false;
        }

        // ==================== LOCAL STORAGE ====================
        function loadData() {
            const stored = localStorage.getItem('comfyJobBoard');
            jobs = stored ? JSON.parse(stored) : {};
        }

        function saveData() {
            localStorage.setItem('comfyJobBoard', JSON.stringify(jobs));
        }

        // ==================== CALENDAR ====================
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDaysInMonth(date) {
            return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        }

        function getFirstDayOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
        }

        function renderMonth(monthDate, containerId) {
            const daysInMonth = getDaysInMonth(monthDate);
            const firstDay = getFirstDayOfMonth(monthDate);
            const monthYear = monthNames[monthDate.getMonth()] + ' ' + monthDate.getFullYear();
            const isMobile = window.innerWidth <= 768;

            let html = `<div class="month-card">
                <div class="month-title">${monthYear}</div>
                <div class="days-grid">`;

            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayNames.forEach(day => {
                html += `<div class="day-header">${day}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="day-cell" style="background: #f0f0f0;"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
                const dateKey = formatDateKey(date);
                const dayJobs = jobs[dateKey] || [{}, {}, {}, {}];
                
                const jobCount = Object.values(dayJobs).filter(j => j && j.customer).length;
                const hasJobs = jobCount > 0;

                if (isMobile) {
                    html += `<div class="day-cell ${hasJobs ? 'has-jobs' : ''}" onclick="handleDayCellClick('${dateKey}', ${day})">
                        <div class="day-number">${day}</div>
                    </div>`;
                } else {
                    html += `<div class="day-cell">
                        <div class="day-number">${day}</div>
                        ${hasJobs ? `<div class="job-count-badge">${jobCount}</div>` : ''}
                        <div class="slots-container">`;

                    for (let slot = 0; slot < 4; slot++) {
                        const job = dayJobs[slot] || {};
                        if (job.customer) {
                            html += `<div class="job-slot filled" onclick="openJobModal('${dateKey}', ${slot})">
                                <div class="slot-content">
                                    <div class="job-customer">${job.customer}</div>
                                    <div class="job-city">${job.city}</div>
                                </div>
                            </div>`;
                        } else {
                            html += `<div class="job-slot" onclick="openJobModal('${dateKey}', ${slot})">
                                <div class="slot-label">Slot ${slot + 1}</div>
                            </div>`;
                        }
                    }

                    html += `</div></div>`;
                }
            }

            const totalCells = firstDay + daysInMonth;
            const remainingCells = (Math.ceil(totalCells / 7) * 7) - totalCells;
            for (let i = 0; i < remainingCells; i++) {
                html += `<div class="day-cell" style="background: #f0f0f0;"></div>`;
            }

            html += `</div></div>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function render() {
            const month1 = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const month2 = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);

            document.getElementById('monthDisplay').textContent = 
                monthNames[month1.getMonth()] + ' & ' + monthNames[month2.getMonth()] + ' ' + month1.getFullYear();

            let html = `<div id="month1"></div><div id="month2"></div>`;
            document.getElementById('calendarGrid').innerHTML = html;

            renderMonth(month1, 'month1');
            renderMonth(month2, 'month2');
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            render();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            render();
        }

        function handleDayCellClick(dateKey, dayNum) {
            // Show detailed view for mobile
            alert('Click a slot to add or edit a job. This feature works better on desktop.');
        }

        // ==================== JOB MODAL ====================
        function openJobModal(dateKey, slotIndex) {
            // Prevent opening if modal is already open
            if (isModalOpen) return;
            isModalOpen = true;

            selectedSlot = { dateKey, slotIndex };
            const dayJobs = jobs[dateKey] || [{}, {}, {}, {}];
            const job = dayJobs[slotIndex] || {};
            const isEditing = !!job.customer;

            document.getElementById('modalTitle').textContent = isEditing ? 'Edit Job' : 'Add Job';

            const isReadonly = currentRole === 'advisor' && isEditing;

            if (isReadonly) {
                document.getElementById('readonlyNotice').innerHTML = 
                    '<div class="readonly-notice">📋 You can view this job but cannot edit it.</div>';
            } else {
                document.getElementById('readonlyNotice').innerHTML = '';
            }

            document.getElementById('customerName').value = job.customer || '';
            document.getElementById('city').value = job.city || '';
            document.getElementById('jobDetails').value = job.jobDetails || '';

            const inputs = ['customerName', 'city', 'jobDetails'];
            inputs.forEach(id => {
                document.getElementById(id).readOnly = isReadonly;
            });

            document.getElementById('saveBtn').style.display = isReadonly ? 'none' : 'block';
            document.getElementById('deleteBtn').style.display = (isEditing && currentRole === 'admin') ? 'block' : 'none';

            document.getElementById('jobModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('jobModal').classList.remove('show');
            selectedSlot = null;
            isModalOpen = false;
            
            // Completely reset form
            ['customerName', 'city', 'jobDetails'].forEach(id => {
                const elem = document.getElementById(id);
                elem.value = '';
                elem.readOnly = false;
            });
            
            // Clear focus
            document.activeElement.blur();
        }

        function saveJob() {
            const customerName = document.getElementById('customerName').value.trim();
            const city = document.getElementById('city').value.trim();
            const jobDetails = document.getElementById('jobDetails').value.trim();

            if (!customerName || !city || !jobDetails) {
                alert('Please fill in all required fields');
                return;
            }

            if (!jobs[selectedSlot.dateKey]) {
                jobs[selectedSlot.dateKey] = [{}, {}, {}, {}];
            }

            jobs[selectedSlot.dateKey][selectedSlot.slotIndex] = {
                customer: customerName,
                city: city,
                jobDetails: jobDetails
            };

            saveData();
            render();
            closeModal();
        }

        function deleteJob() {
            if (currentRole !== 'admin') {
                alert('Only admins can delete jobs');
                return;
            }

            if (confirm('Delete this job?')) {
                jobs[selectedSlot.dateKey][selectedSlot.slotIndex] = {};
                saveData();
                render();
                closeModal();
            }
        }

        // ==================== MODAL CLOSE ON BACKDROP ====================
        document.getElementById('jobModal').addEventListener('click', function(e) {
            if (e.target === this && isModalOpen) {
                closeModal();
            }
        });

        // ==================== INITIAL LOAD ====================
        loadData();
    </script>
</body>
</html>
