<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfy HVAC - Appointment Availability</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .header {
            background: linear-gradient(135deg, #0C447C 0%, #185FA5 100%);
            color: white;
            padding: 25px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .service-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        .service-btn {
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s;
            text-align: center;
        }

        .service-btn:hover {
            border-color: #185FA5;
            background: #f0f7ff;
        }

        .service-btn.active {
            background: #0C447C;
            color: white;
            border-color: #0C447C;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .nav-btn {
            background: #185FA5;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: #0C447C;
        }

        .month-title {
            text-align: center;
            font-weight: 600;
            color: #0C447C;
            font-size: 16px;
            min-width: 150px;
        }

        .calendar {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #185FA5;
            color: white;
        }

        .day-name {
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e0e0e0;
            padding: 1px;
        }

        .calendar-day {
            background: white;
            min-height: 70px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .calendar-day:hover {
            border-color: #185FA5;
            background: #f0f7ff;
        }

        .calendar-day.other-month {
            background: #f5f5f5;
            color: #ccc;
            cursor: default;
        }

        .calendar-day.other-month:hover {
            background: #f5f5f5;
            border-color: transparent;
        }

        .calendar-day.estimator-available {
            background: #d1ecf1;
            border-color: #0c5460;
        }

        .calendar-day.estimator-available:hover {
            background: #bee5eb;
        }

        .calendar-day.technician-available {
            background: #d4edda;
            border-color: #155724;
        }

        .calendar-day.technician-available:hover {
            background: #c3e6cb;
        }

        .calendar-day.estimator-full {
            background: #f8d7da;
            border-color: #721c24;
        }

        .calendar-day.technician-full {
            background: #ffeaa7;
            border-color: #d4a500;
        }

        .calendar-day.selected {
            background: #0C447C;
            color: white;
            border-color: #0C447C;
        }

        .day-number {
            font-weight: 600;
            font-size: 13px;
        }

        .availability-indicator {
            font-size: 11px;
            font-weight: 500;
        }

        .availability-indicator.available {
            color: #28a745;
        }

        .availability-indicator.booked {
            color: #dc3545;
        }

        /* Day Detail Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: #0C447C;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .modal-body {
            padding: 20px;
        }

        .slots-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .time-slot {
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            background: white;
        }

        .time-slot:hover:not(.disabled) {
            border-color: #185FA5;
            background: #f0f7ff;
        }

        .time-slot.selected {
            background: #0C447C;
            color: white;
            border-color: #0C447C;
        }

        .time-slot.disabled {
            background: #f0f0f0;
            color: #999;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #0C447C;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #185FA5;
            box-shadow: 0 0 0 2px rgba(24, 95, 165, 0.1);
        }

        .required {
            color: #D9534F;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: #ddd;
            color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-cancel:hover {
            background: #ccc;
        }

        .btn-book {
            flex: 1;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-book:hover:not(:disabled) {
            background: #218838;
        }

        .btn-book:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .booking-summary {
            background: #e7f3ff;
            border-left: 4px solid #185FA5;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #185FA5;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .error-message {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #185FA5;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #0C447C;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .calendar-day {
                min-height: 60px;
                font-size: 12px;
            }

            .slots-container {
                grid-template-columns: 1fr;
            }
        }

        /* Login Screen Styles */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0C447C 0%, #185FA5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .login-container h1 {
            color: #0C447C;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            outline: none;
            border-color: #0C447C;
        }

        .login-btn {
            padding: 14px;
            background: #185FA5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #0C447C;
        }

        .login-error {
            color: #D9534F;
            font-size: 14px;
            margin-top: 10px;
        }

        .app-container {
            display: none;
        }

        .app-container.authenticated {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>Comfy HVAC</h1>
            <p>Lead Generator Portal</p>
            <div class="login-form">
                <input type="password" id="passwordInput" placeholder="Enter password" onkeypress="if(event.key==='Enter') handleLogin()">
                <button class="login-btn" onclick="handleLogin()">Login</button>
                <div id="loginError" class="login-error"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Comfy HVAC</h1>
                    <p>Book Appointments - Real-Time Availability</p>
                </div>
                <button onclick="handleLogout()" style="background: #D9534F; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">Logout</button>
            </div>
        </div>

        <!-- Service Type Selector -->
        <div class="info-box">
            Select service type to see availability
        </div>

        <div class="service-selector">
            <button class="service-btn active" onclick="selectService('estimate')">
                📋 Estimate
            </button>
            <button class="service-btn" onclick="selectService('repair')">
                🔧 Repair
            </button>
            <button class="service-btn" onclick="selectService('maintenance')">
                🛠️ Maintenance
            </button>
        </div>

        <!-- Calendar Controls -->
        <div class="calendar-controls">
            <button class="nav-btn" onclick="previousMonth()">← Prev</button>
            <div class="month-title" id="monthTitle"></div>
            <button class="nav-btn" onclick="nextMonth()">Next →</button>
        </div>

        <!-- Calendar -->
        <div class="calendar">
            <div class="calendar-header">
                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
        </div>

        <div style="text-align: center; font-size: 12px; color: #666; margin-top: 15px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <div>
                <span style="display: inline-block; background: #d1ecf1; padding: 6px 12px; border-radius: 4px; border: 2px solid #0c5460; margin-right: 5px;">🔵</span>
                <span>Estimators (Austin/Pete)</span>
            </div>
            <div>
                <span style="display: inline-block; background: #d4edda; padding: 6px 12px; border-radius: 4px; border: 2px solid #155724; margin-right: 5px;">🟢</span>
                <span>Technicians (Sergio/Josue)</span>
            </div>
        </div>
    </div>
    </div> <!-- Close app-container -->

    <!-- Day Detail Modal -->
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="dayTitle"></h2>
                <button class="modal-close" onclick="closeDayModal()">×</button>
            </div>
            <div class="modal-body">
                <!-- Available Slots -->
                <div id="slotsSection">
                    <div class="info-box" id="slotInfo">Select an available time slot</div>
                    <div class="slots-container" id="slotsContainer"></div>
                </div>

                <!-- Customer Info Form -->
                <div id="formSection" style="display: none;">
                    <div class="booking-summary" id="bookingSummary"></div>

                    <div class="form-group">
                        <label>Customer Name <span class="required">*</span></label>
                        <input type="text" id="customerName" placeholder="John Smith">
                    </div>

                    <div class="form-group">
                        <label>Phone Number <span class="required">*</span></label>
                        <input type="tel" id="customerPhone" placeholder="(555) 123-4567">
                    </div>

                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" id="customerEmail" placeholder="john@example.com">
                    </div>

                    <div class="form-group">
                        <label>Property Address <span class="required">*</span></label>
                        <textarea id="customerAddress" placeholder="123 Main St, City, State 12345" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="customerNotes" placeholder="Any special requests, follow-up info, or notes about the prospect..." rows="3"></textarea>
                    </div>

                    <div id="bookingMessage"></div>

                    <div class="button-group">
                        <button class="btn-cancel" onclick="backToSlots()">← Back</button>
                        <button class="btn-book" onclick="submitBooking()" id="bookBtn">Book Appointment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== PASSWORD PROTECTION ====================
        const LEAD_GEN_PASSWORD = 'leadgen2024'; // Change this to your desired password

        function handleLogin() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');

            if (!password) {
                errorDiv.textContent = 'Please enter a password';
                return;
            }

            if (password !== LEAD_GEN_PASSWORD) {
                errorDiv.textContent = 'Incorrect password';
                document.getElementById('passwordInput').value = '';
                return;
            }

            // Login successful
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('authenticated');
            initializeApp();
        }

        function initializeApp() {
            renderCalendar();
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('appContainer').classList.remove('authenticated');
                document.getElementById('passwordInput').value = '';
                document.getElementById('loginError').textContent = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // ==================== HOUSE CALL PRO CONFIG ====================
        const HCP_CONFIG = {
            apiKey: '', // User will add this
            baseUrl: 'https://api.housecallpro.com/v2'
        };

        // Staff Information
        const STAFF = {
            estimate: ['austin', 'pete'],
            repair: ['sergio', 'josue'],
            maintenance: ['sergio', 'josue']
        };

        const STAFF_NAMES = {
            austin: 'Austin Vieira',
            pete: 'Pete Fletcher',
            sergio: 'Sergio Valadez',
            josue: 'Josue Burgos'
        };

        // Time Slots (2-hour appointments)
        const TIME_SLOTS = [
            '8:30 AM',
            '10:00 AM',
            '11:30 AM',
            '2:00 PM',
            '3:30 PM'
        ];

        // State
        let currentService = 'estimate';
        let currentDate = new Date();
        let selectedDay = null;
        let selectedSlot = null;
        let availabilityCache = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // App will initialize after successful login
            // Focus on password input
            document.getElementById('passwordInput').focus();
        });

        function selectService(service) {
            currentService = service;
            document.querySelectorAll('.service-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update title
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('monthTitle').textContent = `${monthNames[month]} ${year}`;

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            let html = '';

            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                html += `<div class="calendar-day other-month">${day}</div>`;
            }

            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dateStr = date.toISOString().split('T')[0];
                const dayOfWeek = date.getDay();

                // Skip Sundays
                let cssClass = 'calendar-day';
                let indicatorText = '';

                if (dayOfWeek === 0) {
                    cssClass += ' other-month';
                    indicatorText = 'Closed';
                } else if (date < new Date()) {
                    cssClass += ' other-month';
                    indicatorText = 'Past';
                } else {
                    // Color code based on service type
                    if (currentService === 'estimate') {
                        cssClass += ' estimator-available';
                        indicatorText = '✓ Available (Austin/Pete)';
                    } else {
                        // repair or maintenance
                        cssClass += ' technician-available';
                        indicatorText = '✓ Available (Sergio/Josue)';
                    }
                }

                html += `
                    <div class="${cssClass}" onclick="${dayOfWeek !== 0 && date >= new Date() ? `openDayModal('${dateStr}', ${day})` : ''}">
                        <div class="day-number">${day}</div>
                        <div class="availability-indicator ${indicatorText.includes('✓') ? 'available' : 'booked'}">${indicatorText}</div>
                    </div>
                `;
            }

            // Next month days
            const totalCells = firstDay + daysInMonth;
            const remainingCells = (Math.ceil(totalCells / 7) * 7) - totalCells;
            for (let i = 1; i <= remainingCells; i++) {
                html += `<div class="calendar-day other-month">${i}</div>`;
            }

            document.getElementById('calendarDays').innerHTML = html;
        }

        async function checkDayAvailability(dateStr) {
            // This would call House Call Pro API to check availability for this day
            // For now, we'll load it when the day is clicked
            if (!availabilityCache[dateStr]) {
                availabilityCache[dateStr] = await getAvailableSlotsForDay(dateStr);
            }
        }

        async function getAvailableSlotsForDay(dateStr) {
            try {
                if (!HCP_CONFIG.apiKey) {
                    // No API key configured - return all slots as available
                    return TIME_SLOTS.map(slot => ({time: slot, available: true}));
                }

                const staff = STAFF[currentService] || [];
                const staffIds = staff.join(',');

                // Call House Call Pro API to get booked appointments
                const response = await fetch(
                    `${HCP_CONFIG.baseUrl}/appointments?date=${dateStr}&staff_ids=${staffIds}`,
                    {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${HCP_CONFIG.apiKey}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    console.warn('Failed to fetch appointments');
                    return TIME_SLOTS.map(slot => ({time: slot, available: true}));
                }

                const data = await response.json();
                const booked = new Set();

                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach(apt => {
                        const aptTime = convertHCPTimeToSlot(apt.scheduled_time || apt.time);
                        if (aptTime) booked.add(aptTime);
                    });
                }

                return TIME_SLOTS.map(slot => ({
                    time: slot,
                    available: !booked.has(slot)
                }));

            } catch (error) {
                console.error('Error fetching slots:', error);
                return TIME_SLOTS.map(slot => ({time: slot, available: true}));
            }
        }

        function convertHCPTimeToSlot(hcpTime) {
            if (!hcpTime) return null;
            try {
                // Handle various time formats
                const time = new Date(`2000-01-01 ${hcpTime}`);
                return time.toLocaleTimeString('en-US', { 
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            } catch (e) {
                return null;
            }
        }

        // Function to calculate day of week without Date object timezone issues
        function getDayOfWeek(year, month, day) {
            // Zeller's congruence - works consistently across all platforms
            if (month < 3) {
                month += 12;
                year -= 1;
            }
            const K = year % 100;
            const J = Math.floor(year / 100);
            const h = (day + Math.floor(13 * (month + 1) / 5) + K + Math.floor(K / 4) + Math.floor(J / 4) - 2 * J) % 7;
            // Convert to 0=Sunday, 1=Monday, etc.
            return (h + 6) % 7;
        }

        async function openDayModal(dateStr, dayNum) {
            selectedDay = dateStr;
            selectedSlot = null;

            // Parse date string to get year, month, day
            const [year, month, day] = dateStr.split('-').map(Number);
            
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

            // Use Zeller's algorithm for day of week (works on mobile Safari)
            const dayOfWeek = getDayOfWeek(year, month, day);

            document.getElementById('dayTitle').textContent = `${dayNames[dayOfWeek]}, ${monthNames[month - 1]} ${dayNum}`;

            // Show which staff is handling this
            const staffList = currentService === 'estimate' ? 'Austin Vieira or Pete Fletcher' : 'Sergio Valadez or Josue Burgos';
            const serviceType = currentService === 'estimate' ? 'Installation Estimate' :
                               currentService === 'repair' ? 'Repair' : 'Maintenance/Tune-up';
            document.getElementById('slotInfo').innerHTML = `
                <strong>${serviceType}</strong> - Available with ${staffList}
            `;

            // Load slots
            let slots = availabilityCache[dateStr];
            if (!slots) {
                slots = await getAvailableSlotsForDay(dateStr);
                availabilityCache[dateStr] = slots;
            }

            // Render slots
            let slotsHTML = '';
            slots.forEach(slot => {
                const cssClass = slot.available ? '' : 'disabled';
                slotsHTML += `
                    <div class="time-slot ${cssClass}" onclick="${slot.available ? `selectSlot('${slot.time}', this)` : ''}">
                        ${slot.time}
                    </div>
                `;
            });

            document.getElementById('slotsContainer').innerHTML = slotsHTML;
            document.getElementById('slotsSection').style.display = 'block';
            document.getElementById('formSection').style.display = 'none';

            document.getElementById('dayModal').classList.add('show');
        }

        function closeDayModal() {
            document.getElementById('dayModal').classList.remove('show');
            selectedDay = null;
            selectedSlot = null;
        }

        function selectSlot(slot, element) {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
            selectedSlot = slot;

            // Show form after short delay
            setTimeout(() => {
                showCustomerForm();
            }, 300);
        }

        function showCustomerForm() {
            // Parse date string to get year, month, day
            const [year, month, day] = selectedDay.split('-').map(Number);
            
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const dateStr = `${monthNames[month - 1]} ${day}, ${year}`;

            const serviceType = currentService === 'estimate' ? 'Installation Estimate' :
                               currentService === 'repair' ? 'Repair' : 'Maintenance/Tune-up';

            const staffList = currentService === 'estimate' ? 'Austin Vieira or Pete Fletcher' : 'Sergio Valadez or Josue Burgos';

            document.getElementById('bookingSummary').innerHTML = `
                <strong>Service:</strong> ${serviceType}<br>
                <strong>Date & Time:</strong> ${dateStr} at ${selectedSlot}<br>
                <strong>Staff:</strong> ${staffList}
            `;

            document.getElementById('slotsSection').style.display = 'none';
            document.getElementById('formSection').style.display = 'block';

            // Clear form
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerEmail').value = '';
            document.getElementById('customerAddress').value = '';
            document.getElementById('customerNotes').value = '';
            document.getElementById('bookingMessage').innerHTML = '';
        }

        function backToSlots() {
            document.getElementById('slotsSection').style.display = 'block';
            document.getElementById('formSection').style.display = 'none';
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            selectedSlot = null;
        }

        async function submitBooking() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const email = document.getElementById('customerEmail').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const notes = document.getElementById('customerNotes').value.trim();

            if (!name || !phone || !email || !address) {
                alert('Please fill in all required fields');
                return;
            }

            const messageDiv = document.getElementById('bookingMessage');
            const bookBtn = document.getElementById('bookBtn');

            bookBtn.disabled = true;
            bookBtn.textContent = 'Booking...';
            messageDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Creating appointment...</div>';

            try {
                if (!HCP_CONFIG.apiKey) {
                    throw new Error('House Call Pro API key not configured');
                }

                const appointmentData = {
                    customer_name: name,
                    customer_phone: phone,
                    customer_email: email,
                    address: address,
                    service_type: currentService,
                    scheduled_time: `${selectedDay}T${convertSlotToTime(selectedSlot)}`,
                    notes: `Booked by Lead Generator at Home Depot${notes ? '\n\nProspect Notes: ' + notes : ''}`
                };

                const response = await fetch(`${HCP_CONFIG.baseUrl}/appointments`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${HCP_CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(appointmentData)
                });

                if (!response.ok) {
                    throw new Error('Failed to create appointment');
                }

                messageDiv.innerHTML = `
                    <div class="success-message">
                        ✓ Appointment booked!<br>
                        Customer will receive SMS confirmation at ${phone}
                    </div>
                `;

                setTimeout(() => {
                    closeDayModal();
                    renderCalendar();
                    alert('Appointment booked successfully!');
                }, 2000);

            } catch (error) {
                messageDiv.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
                bookBtn.disabled = false;
                bookBtn.textContent = 'Book Appointment';
            }
        }

        function convertSlotToTime(slot) {
            try {
                const time = new Date(`2000-01-01 ${slot}`);
                return time.toTimeString().split(' ')[0]; // Returns HH:MM:SS
            } catch (e) {
                return '08:00:00';
            }
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }
    </script>
</body>
</html>
