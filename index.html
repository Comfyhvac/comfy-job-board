<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>Comfy HVAC</h1>
            <p>Job Board Access</p>
            <div class="login-form">
                <input type="password" id="passwordInput" placeholder="Enter password" />
                
                <div class="role-selector">
                    <button class="role-btn active" data-role="advisor">Comfort Advisor</button>
                    <button class="role-btn" data-role="admin">Admin</button>
                </div>

                <button class="login-btn" onclick="handleLogin()">Login</button>
                <div id="loginError" class="error-message"></div>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="header-content">
                <h1>Comfy HVAC - Job Board</h1>
                <div class="header-info">
                    <div class="role-badge" id="roleDisplay"></div>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="controls">
                <div class="month-nav">
                    <button class="nav-btn" onclick="previousMonth()">← Previous</button>
                    <div class="current-months" id="monthDisplay"></div>
                    <button class="nav-btn" onclick="nextMonth()">Next →</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <div class="modal" id="jobModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="readonlyNotice"></div>
                <div class="form-group">
                    <label>Customer Name <span class="required">*</span></label>
                    <input type="text" id="customerName" placeholder="Customer name">
                </div>
                <div class="form-group">
                    <label>City <span class="required">*</span></label>
                    <input type="text" id="city" placeholder="City">
                </div>
                <div class="form-group">
                    <label>Job Details <span class="required">*</span></label>
                    <textarea id="jobDetails" placeholder="Describe the work to be done..."></textarea>
                </div>
                <div class="form-group">
                    <label>Contact Phone</label>
                    <input type="tel" id="phone" placeholder="Phone number">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="Job address">
                </div>

                <div class="form-actions">
                    <button class="btn-save" onclick="saveJob()" id="saveBtn">Save Job</button>
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-delete" onclick="deleteJob()" id="deleteBtn" style="display: none;">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="dayDetailModal">
        <div class="day-detail-content">
            <div class="day-detail-header">
                <h2 id="dayDetailTitle"></h2>
                <button class="modal-close" onclick="closeDayDetail()">×</button>
            </div>
            <div class="day-detail-body">
                <div class="slots-list" id="dayDetailSlots"></div>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD = 'comfy2024';
        let currentRole = 'advisor';
        let currentDate = new Date();
        let selectedSlot = null;
        let jobs = {};

        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        // Role selection
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentRole = this.dataset.role;
            });
        });

        function handleLogin() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');

            if (!password) {
                errorDiv.textContent = 'Please enter a password';
                return;
            }

            if (password !== PASSWORD) {
                errorDiv.textContent = 'Incorrect password';
                return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('show');
            document.getElementById('roleDisplay').textContent = currentRole === 'advisor' ? 'Comfort Advisor' : 'Admin';
            
            loadJobs();
            render();
        }

        function handleLogout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').classList.remove('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').textContent = '';
            currentDate = new Date();
            jobs = {};
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDaysInMonth(date) {
            return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        }

        function getFirstDayOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
        }

        function isMobile() {
            return window.innerWidth <= 768;
        }

        function renderMonth(monthDate, containerId) {
            const daysInMonth = getDaysInMonth(monthDate);
            const firstDay = getFirstDayOfMonth(monthDate);
            const monthYear = monthNames[monthDate.getMonth()] + ' ' + monthDate.getFullYear();
            const mobile = isMobile();

            let html = `<div class="month-card">
                <div class="month-title">${monthYear}</div>
                <div class="days-grid">`;

            // Day headers
            dayNames.forEach(day => {
                html += `<div class="day-header">${day.slice(0, 3)}</div>`;
            });

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="day-cell" style="background: #f0f0f0;"></div>`;
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
                const dateKey = formatDateKey(date);
                const dayJobs = jobs[dateKey] || [{}, {}, {}, {}];
                
                // Count filled jobs
                const jobCount = dayJobs.filter(j => j.customer).length;
                const hasJobs = jobCount > 0;

                if (mobile) {
                    // Mobile: Compact day view with click to see slots
                    html += `<div class="day-cell ${hasJobs ? 'has-jobs' : ''}" onclick="openDayDetail('${dateKey}', ${day})">
                        <div class="day-number">${day}</div>
                        ${hasJobs ? `<div class="job-indicator">●●●</div>` : ''}
                    </div>`;
                } else {
                    // Desktop: Show all slots in day cell
                    html += `<div class="day-cell">
                        <div class="day-number">${day}</div>
                        ${hasJobs ? `<div class="job-count-badge">${jobCount}</div>` : ''}
                        <div class="slots-container">`;

                    for (let slot = 0; slot < 4; slot++) {
                        const job = dayJobs[slot] || {};
                        if (job.customer) {
                            html += `<div class="job-slot filled" onclick="openJobModal('${dateKey}', ${slot})" title="Click to view/edit">
                                <div class="slot-content">
                                    <div class="job-customer">${job.customer}</div>
                                    <div class="job-city">${job.city}</div>
                                    <div class="job-details">${job.jobDetails.substring(0, 30)}...</div>
                                </div>
                            </div>`;
                        } else {
                            html += `<div class="job-slot" onclick="openJobModal('${dateKey}', ${slot})" title="Click to add job">
                                <div class="slot-label">Slot ${slot + 1}</div>
                            </div>`;
                        }
                    }

                    html += `</div></div>`;
                }
            }

            // Empty cells after last day
            const totalCells = firstDay + daysInMonth;
            const remainingCells = (Math.ceil(totalCells / 7) * 7) - totalCells;
            for (let i = 0; i < remainingCells; i++) {
                html += `<div class="day-cell" style="background: #f0f0f0;"></div>`;
            }

            html += `</div></div>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function render() {
            const month1 = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const month2 = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);

            document.getElementById('monthDisplay').textContent = 
                monthNames[month1.getMonth()] + ' & ' + monthNames[month2.getMonth()] + ' ' + month1.getFullYear();

            let html = `<div id="month1"></div><div id="month2"></div>`;
            document.getElementById('calendarGrid').innerHTML = html;

            renderMonth(month1, 'month1');
            renderMonth(month2, 'month2');
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            render();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            render();
        }

        function openJobModal(dateKey, slotIndex) {
            selectedSlot = { dateKey, slotIndex };
            const dayJobs = jobs[dateKey] || [{}, {}, {}, {}];
            const job = dayJobs[slotIndex] || {};
            const isEditing = !!job.customer;

            // Set form title
            document.getElementById('modalTitle').textContent = isEditing ? 'Edit Job' : 'Add New Job';

            // Check if advisor and editing (readonly mode)
            const isReadonly = currentRole === 'advisor' && isEditing;

            if (isReadonly) {
                document.getElementById('readonlyNotice').innerHTML = 
                    '<div class="readonly-notice">📋 You can view this job but cannot edit it. Only admins can modify existing jobs.</div>';
            } else {
                document.getElementById('readonlyNotice').innerHTML = '';
            }

            // Fill form
            document.getElementById('customerName').value = job.customer || '';
            document.getElementById('city').value = job.city || '';
            document.getElementById('jobDetails').value = job.jobDetails || '';
            document.getElementById('phone').value = job.phone || '';
            document.getElementById('address').value = job.address || '';

            // Set form readonly state
            const inputs = ['customerName', 'city', 'jobDetails', 'phone', 'address'];
            inputs.forEach(id => {
                document.getElementById(id).readOnly = isReadonly;
            });

            // Show/hide buttons
            document.getElementById('saveBtn').style.display = isReadonly ? 'none' : 'block';
            document.getElementById('deleteBtn').style.display = (isEditing && currentRole === 'admin') ? 'block' : 'none';

            document.getElementById('jobModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('jobModal').classList.remove('show');
            selectedSlot = null;
        }

        function openDayDetail(dateKey, dayNum) {
            const dayJobs = jobs[dateKey] || [{}, {}, {}, {}];
            const date = new Date(dateKey);
            const dayName = dayNames[date.getDay()];

            document.getElementById('dayDetailTitle').textContent = `${dayName}, ${monthNames[date.getMonth()]} ${dayNum}`;

            let html = '';
            let hasAnyJobs = false;

            for (let slot = 0; slot < 4; slot++) {
                const job = dayJobs[slot] || {};
                if (job.customer) {
                    hasAnyJobs = true;
                    html += `<div class="slot-card filled" onclick="openJobModal('${dateKey}', ${slot})">
                        <div class="slot-number">Slot ${slot + 1}</div>
                        <div class="slot-card-content">
                            <div class="slot-card-customer">${job.customer}</div>
                            <div class="slot-card-city">${job.city}</div>
                            <div class="slot-card-details">${job.jobDetails}</div>
                            ${job.phone ? `<div style="margin-top: 6px; color: #666; font-size: 11px;">📞 ${job.phone}</div>` : ''}
                            ${job.address ? `<div style="margin-top: 4px; color: #666; font-size: 11px;">📍 ${job.address}</div>` : ''}
                        </div>
                    </div>`;
                } else {
                    html += `<div class="slot-card" onclick="openJobModal('${dateKey}', ${slot})">
                        <div class="slot-number">Slot ${slot + 1}</div>
                        <div class="slot-empty-text">Click to add job</div>
                    </div>`;
                }
            }

            document.getElementById('dayDetailSlots').innerHTML = html;
            document.getElementById('dayDetailModal').classList.add('show');
        }

        function closeDayDetail() {
            document.getElementById('dayDetailModal').classList.remove('show');
        }

        function saveJob() {
            const customerName = document.getElementById('customerName').value.trim();
            const city = document.getElementById('city').value.trim();
            const jobDetails = document.getElementById('jobDetails').value.trim();

            if (!customerName || !city || !jobDetails) {
                alert('Please fill in all required fields: Customer Name, City, and Job Details');
                return;
            }

            if (!jobs[selectedSlot.dateKey]) {
                jobs[selectedSlot.dateKey] = [{}, {}, {}, {}];
            }

            jobs[selectedSlot.dateKey][selectedSlot.slotIndex] = {
                customer: customerName,
                city: city,
                jobDetails: jobDetails,
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                createdBy: currentRole,
                createdDate: new Date().toISOString()
            };

            saveJobs();
            render();
            closeModal();
        }

        function deleteJob() {
            if (currentRole !== 'admin') {
                alert('Only admins can delete jobs');
                return;
            }

            if (confirm('Are you sure you want to delete this job?')) {
                jobs[selectedSlot.dateKey][selectedSlot.slotIndex] = {};
                saveJobs();
                render();
                closeModal();
            }
        }

        function saveJobs() {
            localStorage.setItem('comfyJobBoard', JSON.stringify(jobs));
        }

        function loadJobs() {
            const saved = localStorage.getItem('comfyJobBoard');
            jobs = saved ? JSON.parse(saved) : {};
        }

        // Close modal on backdrop click
        document.getElementById('jobModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('dayDetailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDayDetail();
        });

        // Handle window resize to re-render for mobile/desktop switch
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                render();
            }, 250);
        });

        // Initial render
        loadJobs();
    </script>
</body>
</html>
