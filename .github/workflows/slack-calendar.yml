name: Post Calendar to Slack

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  post-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        run: |
          curl "${{ secrets.SLACK_WEBHOOK_URL }}" -d '{"text":"📅 Comfy HVAC Calendar - 7 AM & 1 PM Daily"}'
