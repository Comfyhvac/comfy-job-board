name: Post Calendar to Slack

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  post-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} -H 'Content-type: application/json' --data '{"text":"📅 Comfy HVAC Install Calendar - Posted at 7 AM & 1 PM"}'
