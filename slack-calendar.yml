name: Post Calendar to Slack

on:
  schedule:
    # 7 AM UTC (adjust for your timezone - see README)
    - cron: '0 7 * * *'
    # 1 PM UTC (adjust for your timezone - see README)
    - cron: '0 13 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  post-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install playwright puppeteer

      - name: Generate calendar image and post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/screenshot.js

      - name: Report status
        if: always()
        run: echo "Calendar post workflow completed"
